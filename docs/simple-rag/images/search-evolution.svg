<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="t d">
  <title id="t">How search got smarter</title>
  <desc id="d">Keyword search ties on filler words; TF-IDF breaks the tie by weighting rare words; BM25 stops repeated words from winning; semantic search with all-MiniLM-L6-v2 matches meaning, finding felines.txt for the word cat. Real scores from the practice files are shown for each step.</desc>
  <style>
    .b { fill: #fcfaf4; stroke: #2b2721; stroke-width: 2; }
    .l { fill: none; stroke: #9a6a3e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .s { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; fill: #2b2721; }
    .m { font-family: Consolas, 'Courier New', monospace; fill: #2b2721; }
    .c { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 1.6px; fill: #9a6a3e; }
    .i { font-style: italic; }
    .e { fill: #9a6a3e; }
    .x { fill-opacity: .72; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#9a6a3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="720" height="1200" fill="#f4f0e7"/>
  <rect x="10.5" y="10.5" width="699" height="1179" fill="none" stroke="#2b2721" stroke-opacity=".14"/>

  <text class="s" x="360" y="60" text-anchor="middle" font-size="38">How search got smarter</text>
  <text class="c" x="360" y="92" text-anchor="middle" font-size="15">EACH METHOD FIXES THE ONE BEFORE</text>

  <!-- 1 keyword -->
  <rect class="b" x="50" y="126" width="620" height="196" rx="10"/>
  <text class="s" x="80" y="168" font-size="30">Keyword search</text>
  <text class="c" x="640" y="166" text-anchor="end" font-size="15">STEPS 3–4</text>
  <text class="m" x="80" y="198" font-size="16">keyword.search(query, docs, k)</text>
  <text class="s" x="80" y="230" font-size="19">Count how many question words a document contains.</text>
  <text class="s i x" x="80" y="266" font-size="17">“is a kitten a good pet” → coffee, felines and</text>
  <text class="s i x" x="80" y="292" font-size="17">python_language all score 3: a three-way tie.</text>

  <path class="l" d="M110 322 v74" marker-end="url(#arrow)"/>
  <text class="s i e" x="134" y="366" font-size="18">but “a” and “is” count as much as “kitten”</text>

  <!-- 2 tf-idf -->
  <rect class="b" x="50" y="400" width="620" height="196" rx="10"/>
  <text class="s" x="80" y="442" font-size="30">TF-IDF</text>
  <text class="c" x="640" y="440" text-anchor="end" font-size="15">STEPS 5–6</text>
  <text class="m" x="80" y="472" font-size="16">tfidf.search · score = Σ tf × idf</text>
  <text class="s" x="80" y="504" font-size="19">Frequent in this document × rare everywhere else.</text>
  <text class="s i x" x="80" y="540" font-size="17">Same question → felines.txt 0.046, next 0.021.</text>
  <text class="s i x" x="80" y="566" font-size="17">“a” is in every file, so its weight is exactly 0.</text>

  <path class="l" d="M110 596 v74" marker-end="url(#arrow)"/>
  <text class="s i e" x="134" y="640" font-size="18">but repeating a word keeps adding score</text>

  <!-- 3 bm25 -->
  <rect class="b" x="50" y="674" width="620" height="196" rx="10"/>
  <text class="s" x="80" y="716" font-size="30">BM25</text>
  <text class="c" x="640" y="714" text-anchor="end" font-size="15">STEPS 7–8</text>
  <text class="m" x="80" y="746" font-size="16">bm25.search · term_score(f, k1, b)</text>
  <text class="s" x="80" y="778" font-size="19">TF-IDF + saturation (k1) + length fairness (b).</text>
  <text class="s i x" x="80" y="814" font-size="17">Spam file “python ×8”, question “python snake”:</text>
  <text class="s i x" x="80" y="840" font-size="17">TF-IDF ranks spam first (0.511); BM25 picks the snake (2.245).</text>

  <path class="l" d="M110 870 v74" marker-end="url(#arrow)"/>
  <text class="s i e" x="134" y="914" font-size="18">but none of them understands meaning</text>

  <!-- 4 semantic -->
  <rect class="b" x="50" y="948" width="620" height="210" rx="10" stroke="#9a6a3e" stroke-width="2.4"/>
  <text class="s" x="80" y="990" font-size="30">Semantic search</text>
  <text class="c" x="640" y="988" text-anchor="end" font-size="15">STEPS 9–10</text>
  <text class="m" x="80" y="1020" font-size="16">semantic.search · embed + cosine</text>
  <text class="s e" x="80" y="1048" font-size="18">model: all-MiniLM-L6-v2 (384 numbers per text)</text>
  <text class="s" x="80" y="1078" font-size="19">Compare meaning, not spelling.</text>
  <text class="s i x" x="80" y="1112" font-size="17">“cat” → felines.txt 0.459, though “cat” never appears in it.</text>
  <text class="s i x" x="80" y="1138" font-size="17">The three word-based engines find nothing.</text>
</svg>
