<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1250" role="img" aria-labelledby="t d">
  <title id="t">Simple RAG: the pipeline</title>
  <desc id="d">Text files are loaded into Documents by loaders.load_folder, searched by one of four interchangeable engines (keyword, TF-IDF, BM25, or semantic search with all-MiniLM-L6-v2), the top results are turned into labelled context by rag.build_context, and llm.ask sends that context with the rules to an OpenAI-compatible LLM, which answers and cites the source file.</desc>
  <style>
    .b { fill: #fcfaf4; stroke: #2b2721; stroke-width: 2; }
    .l { fill: none; stroke: #2b2721; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .s { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; fill: #2b2721; }
    .m { font-family: Consolas, 'Courier New', monospace; fill: #2b2721; }
    .c { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 1.6px; fill: #9a6a3e; }
    .i { font-style: italic; fill-opacity: .72; }
    .e { fill: #9a6a3e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#2b2721" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="720" height="1250" fill="#f4f0e7"/>
  <rect x="10.5" y="10.5" width="699" height="1229" fill="none" stroke="#2b2721" stroke-opacity=".14"/>

  <text class="s" x="360" y="60" text-anchor="middle" font-size="38">Simple RAG · the pipeline</text>
  <text class="c" x="360" y="92" text-anchor="middle" font-size="15" fill-opacity=".8">WHERE EACH FUNCTION AND MODEL COMES IN</text>

  <!-- data -->
  <rect class="b" x="220" y="120" width="280" height="72" rx="8"/>
  <text class="m" x="360" y="152" text-anchor="middle" font-size="20">data/*.txt</text>
  <text class="s i" x="360" y="178" text-anchor="middle" font-size="16">4 small practice files</text>
  <path class="l" d="M360 192 v34" marker-end="url(#arrow)"/>

  <!-- loading -->
  <rect class="b" x="160" y="230" width="400" height="94" rx="8"/>
  <text class="c" x="548" y="252" text-anchor="end" font-size="15">STEP 2</text>
  <text class="m" x="360" y="272" text-anchor="middle" font-size="19">loaders.load_folder()</text>
  <text class="m" x="360" y="304" text-anchor="middle" font-size="16">→ Document(text, source)</text>
  <text class="c" x="62" y="277" text-anchor="middle" font-size="15" transform="rotate(-90 62 277)">LOAD</text>

  <!-- fan out to the four engines -->
  <path class="l" d="M360 324 v32 M97 356 H623"/>
  <path class="l" d="M97 356 v34" marker-end="url(#arrow)"/>
  <path class="l" d="M272 356 v34" marker-end="url(#arrow)"/>
  <path class="l" d="M447 356 v34" marker-end="url(#arrow)"/>
  <path class="l" d="M622 356 v34" marker-end="url(#arrow)"/>

  <!-- four interchangeable search engines -->
  <g>
    <rect class="b" x="17" y="396" width="160" height="170" rx="8"/>
    <text class="s" x="97" y="430" text-anchor="middle" font-size="23">Keyword</text>
    <text class="m" x="97" y="458" text-anchor="middle" font-size="15">keyword.search</text>
    <text class="s" x="97" y="488" text-anchor="middle" font-size="16">tokenize, then</text>
    <text class="s" x="97" y="510" text-anchor="middle" font-size="16">count shared words</text>
    <text class="c" x="97" y="550" text-anchor="middle" font-size="15">STEPS 3–4</text>
  </g>
  <g>
    <rect class="b" x="192" y="396" width="160" height="170" rx="8"/>
    <text class="s" x="272" y="430" text-anchor="middle" font-size="23">TF-IDF</text>
    <text class="m" x="272" y="458" text-anchor="middle" font-size="15">tfidf.search</text>
    <text class="s" x="272" y="488" text-anchor="middle" font-size="16">Σ tf × idf</text>
    <text class="s" x="272" y="510" text-anchor="middle" font-size="16">rare words win</text>
    <text class="c" x="272" y="550" text-anchor="middle" font-size="15">STEPS 5–6</text>
  </g>
  <g>
    <rect class="b" x="367" y="396" width="160" height="170" rx="8"/>
    <text class="s" x="447" y="430" text-anchor="middle" font-size="23">BM25</text>
    <text class="m" x="447" y="458" text-anchor="middle" font-size="15">bm25.search</text>
    <text class="s" x="447" y="488" text-anchor="middle" font-size="16">term_score with</text>
    <text class="s" x="447" y="510" text-anchor="middle" font-size="16">knobs k1 and b</text>
    <text class="c" x="447" y="550" text-anchor="middle" font-size="15">STEPS 7–8</text>
  </g>
  <g>
    <rect class="b" x="542" y="396" width="160" height="170" rx="8" stroke="#9a6a3e"/>
    <text class="s" x="622" y="430" text-anchor="middle" font-size="23">Semantic</text>
    <text class="m" x="622" y="458" text-anchor="middle" font-size="15">semantic.search</text>
    <text class="s" x="622" y="488" text-anchor="middle" font-size="16">embed + cosine</text>
    <text class="s e" x="622" y="510" text-anchor="middle" font-size="15">all-MiniLM-L6-v2</text>
    <text class="c" x="622" y="550" text-anchor="middle" font-size="15">STEPS 9–10</text>
  </g>

  <!-- merge -->
  <path class="l" d="M97 566 v20 M272 566 v20 M447 566 v20 M622 566 v20 M97 586 H622 M360 586 v38" marker-end="url(#arrow)"/>

  <!-- top-k -->
  <rect class="b" x="130" y="628" width="460" height="104" rx="8"/>
  <text class="s" x="360" y="660" text-anchor="middle" font-size="21">top-k results</text>
  <text class="m" x="360" y="690" text-anchor="middle" font-size="16">[(score, Document), ...]</text>
  <text class="s i" x="360" y="716" text-anchor="middle" font-size="15">same shape from every engine · compare.py (step 8)</text>
  <text class="c" x="62" y="680" text-anchor="middle" font-size="15" transform="rotate(-90 62 680)">RETRIEVE</text>
  <path class="l" d="M360 732 v36" marker-end="url(#arrow)"/>

  <!-- augment -->
  <rect class="b" x="130" y="772" width="460" height="94" rx="8"/>
  <text class="c" x="578" y="794" text-anchor="end" font-size="15">STEP 12</text>
  <text class="m" x="360" y="816" text-anchor="middle" font-size="18">rag.build_context(results)</text>
  <text class="m" x="360" y="846" text-anchor="middle" font-size="16">"[felines.txt]\n&lt;its text&gt;"</text>
  <text class="c" x="62" y="819" text-anchor="middle" font-size="15" transform="rotate(-90 62 819)">AUGMENT</text>
  <path class="l" d="M360 866 v36" marker-end="url(#arrow)"/>

  <!-- generate -->
  <rect class="b" x="110" y="906" width="500" height="114" rx="8" stroke="#9a6a3e"/>
  <text class="c" x="598" y="928" text-anchor="end" font-size="15">STEP 11</text>
  <text class="m" x="360" y="952" text-anchor="middle" font-size="18">llm.ask(prompt, system=RULES)</text>
  <text class="s e" x="360" y="980" text-anchor="middle" font-size="17">any OpenAI-compatible LLM</text>
  <text class="s i" x="360" y="1005" text-anchor="middle" font-size="15">RULES: only the context · else “I don't know” · cite the file</text>
  <text class="c" x="52" y="963" text-anchor="middle" font-size="15" transform="rotate(-90 52 963)">GENERATE</text>
  <path class="l" d="M360 1020 v38" marker-end="url(#arrow)"/>

  <!-- answer -->
  <path class="b" d="M190 1062 h340 a10 10 0 0 1 10 10 v100 a10 10 0 0 1 -10 10 h-150 l-22 22 l2 -22 h-170 a10 10 0 0 1 -10 -10 v-100 a10 10 0 0 1 10 -10 z"/>
  <text class="s i" x="360" y="1098" text-anchor="middle" font-size="21" style="fill-opacity:1">“A kitten can sleep up to</text>
  <text class="s i" x="360" y="1124" text-anchor="middle" font-size="21" style="fill-opacity:1">twenty hours a day.”</text>
  <text class="m e" x="360" y="1158" text-anchor="middle" font-size="17">[felines.txt]</text>

  <text class="c" x="360" y="1232" text-anchor="middle" font-size="15" style="fill:#2b2721" fill-opacity=".45">RETRIEVE · AUGMENT · GENERATE</text>
</svg>
